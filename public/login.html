<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/styles/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/iconopagina.png" type="image/x-icon">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline';">
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains">
</head>
<body>
    <div class="logo-container">
        <img src="/assets/iconopagina.png" alt="Logo" class="logo">
    </div>
    
    <div class="container">
        <h1 class="titulo">Acceso Administrador</h1>
        
        <form id="loginForm" class="registro-container">
            <input type="text" 
                   class="input-numero" 
                   placeholder="Usuario" 
                   id="username"
                   required>
            
            <input type="password" 
                   class="input-numero" 
                   placeholder="Contraseña" 
                   id="password"
                   required>
            
            <button type="submit" class="btn-guardar">
                Ingresar
            </button>
        </form>
    </div>
    <script src="/auth.js"></script>
</body>
</html>
